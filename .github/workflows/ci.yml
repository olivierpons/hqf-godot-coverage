# Quality gate, run once a day and on demand only (never on push).
name: CI

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

concurrency:
  group: ci
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: pytest, mypy, black, isort
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run mypy
      - run: uv run black --check .
      - run: uv run isort --check .
